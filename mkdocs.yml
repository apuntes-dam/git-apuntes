site_name: Git y GitHub · Apuntes
site_description: "Apuntes y prácticas de Git y GitHub: ramas, SSH, rebase y Pull Requests."
site_url: https://apuntes-dam.github.io/git-apuntes/
repo_url: https://github.com/apuntes-dam/git-apuntes
repo_name: GitHub
theme:
  name: material
  language: es
  logo: assets/logo.svg
  favicon: assets/logo.svg
  palette:
    - scheme: slate
      primary: custom
      toggle:
        icon: material/weather-night
        name: Cambiar a modo claro
    - scheme: default
      primary: custom
      toggle:
        icon: material/weather-sunny
        name: Cambiar a modo oscuro
  features:
    - navigation.sections
    - navigation.top
    - content.code.copy
    - search.highlight
extra_css:
  - assets/extra.css
  - assets/lenguajes.css?v=ed6a84c1
extra_javascript:
  - assets/lenguajes.js?v=ed6a84c1
extra:
  social:
    - icon: fontawesome/brands/github
      link: https://github.com/apuntes-dam/
      name: Síguenos en GitHub
copyright: Practica los Lenguajes de Programación para 1º DAM y 2º DAM · <a href="https://github.com/apuntes-dam/">Síguenos en GitHub</a>
markdown_extensions:
  - admonition
  - tables
  - attr_list
  - toc:
      permalink: true
  - pymdownx.highlight
  - pymdownx.superfences
  - pymdownx.details
nav:
  - Inicio: index.md
  - "U1 · Primeros pasos":
      - u01/index.md
      - "1.1 Conceptos": u01/conceptos.md
      - "1.2 Instalar y configurar": u01/instalar.md
      - "1.3 Tu primer repositorio": u01/primer-repo.md
      - "G1 Ejercicios": u01/ejercicios.md
  - "U2 · Ramas":
      - u02/index.md
      - "2.1 Ramas, fusiones y stash": u02/ramas.md
      - "G2 Ejercicios": u02/ejercicios.md
  - "U3 · GitHub y SSH":
      - u03/index.md
      - "3.1 GitHub y remotos": u03/github.md
      - "3.2 Autenticación SSH": u03/ssh.md
      - "G3 Ejercicios": u03/ejercicios.md
  - "U4 · Flujo profesional":
      - u04/index.md
      - "4.1 Commits profesionales": u04/commits.md
      - "4.2 Rebase y Pull Requests": u04/rebase-pr.md
      - "G4 Ejercicios": u04/ejercicios.md
  - "Avanzado": avanzado/index.md
  - "A1 · Reescribir y recuperar la historia":
      - avanzado/a1/index.md
      - "A1.1 Deshacer: amend, reset y revert": avanzado/a1/01-deshacer.md
      - "A1.2 Recuperar y mover commits": avanzado/a1/02-recuperar.md
      - "GA1 Ejercicios": avanzado/a1/ejercicios.md
  - "A2 · Rebase interactivo y limpiar la historia":
      - avanzado/a2/index.md
      - "A2.1 Rebase interactivo": avanzado/a2/01-rebase-interactivo.md
      - "A2.2 Autosquash, --onto y conflictos": avanzado/a2/02-onto-conflictos.md
      - "GA2 Ejercicios": avanzado/a2/ejercicios.md
  - "A3 · Investigar la historia":
      - avanzado/a3/index.md
      - "A3.1 Preguntarle al historial": avanzado/a3/01-log.md
      - "A3.2 Quién, cuándo y dónde: blame, bisect y grep": avanzado/a3/02-blame-bisect.md
      - "GA3 Ejercicios": avanzado/a3/ejercicios.md
  - "A4 · Ramas y trabajo en equipo":
      - avanzado/a4/index.md
      - "A4.1 Fusionar, conflictos y etiquetas": avanzado/a4/01-fusionar.md
      - "A4.2 Flujos de trabajo, stash y worktree": avanzado/a4/02-flujos.md
      - "GA4 Ejercicios": avanzado/a4/ejercicios.md
  - "A5 · Automatizar y configurar":
      - avanzado/a5/index.md
      - "A5.1 Hooks, alias y configuración": avanzado/a5/01-hooks-config.md
      - "A5.2 Limpiar, exportar y automatizar en el servidor": avanzado/a5/02-limpiar-ci.md
      - "GA5 Ejercicios": avanzado/a5/ejercicios.md
  - "Chuleta de comandos": chuleta.md
